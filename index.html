<style>
:root{--bg:#f6f2eb;--paper:#fbf8f3;--ink:#4e3324;--mute:#8c7262;--line:#ddd4c8;--accent:#8a5a3c;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",serif;font-size:19px;line-height:1.65}
@font-face{font-family:Jomhuria;src:url(/fonts/Jomhuria-Regular.ttf) format("truetype");font-display:swap}
html[lang=ar] body{font-family:Tajawal,sans-serif;font-size:18px;line-height:1.85}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3,html[lang=ar] .mark b,html[lang=ar] .quote blockquote,html[lang=ar] .date,html[lang=ar] .strip h4{font-family:Jomhuria,serif;font-weight:400;line-height:1;letter-spacing:0}
html[lang=ar] .pagehead h1{font-size:84px}html[lang=ar] .ctext h1{font-size:130px}html[lang=ar] .h2b{font-size:70px}html[lang=ar] .srow h2,html[lang=ar] .secthead h2{font-size:58px}
html[lang=ar] .tile h3{font-size:38px}html[lang=ar] .work h3{font-size:42px}html[lang=ar] .card h3{font-size:46px}html[lang=ar] .quote blockquote{font-size:68px}html[lang=ar] .mark b{font-size:34px}html[lang=ar] .strip h4{font-size:34px}html[lang=ar] .date{font-size:70px}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.ui{font-family:Jost,sans-serif;font-weight:400;letter-spacing:.16em;text-transform:uppercase;font-size:12.5px}
html[lang=ar] .ui{font-family:Tajawal,sans-serif;letter-spacing:0;text-transform:none;font-size:17px}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(246,242,235,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1320px;margin:auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:12px 24px}
.bar .mark{order:-1;justify-self:start}.bar .left{justify-self:center}
.mark{display:flex;align-items:center;gap:12px;justify-self:center}
.mark img{height:50px}
.mark b{font-weight:500;font-size:21px;letter-spacing:.08em;white-space:nowrap}
html[lang=ar] .mark b{letter-spacing:0}
nav.main{display:flex;gap:18px;white-space:nowrap;align-items:center}
nav.main a{color:var(--mute);padding:4px 0;border-bottom:1px solid transparent}
nav.main a.acq{color:var(--bg);background:var(--accent);border:1px solid var(--accent);padding:6px 14px}nav.main a.acq:hover{opacity:.85;border-color:var(--accent)}
nav.main a.on,nav.main a:hover{color:var(--ink);border-color:var(--ink)}
.right{justify-self:end;display:flex;align-items:center;gap:18px}
.lang{border:1px solid var(--ink);background:none;color:var(--ink);padding:6px 12px;cursor:pointer}
.burger{display:none;background:none;border:0;font-size:24px;cursor:pointer;color:var(--ink)}
/* pages */
main{min-height:70vh}
.page{display:none;animation:fade .5s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.wrap{max-width:1240px;margin:auto;padding:0 24px}
.kicker{color:var(--mute);margin:0 0 10px}
h1,h2,h3{font-weight:400;margin:0}
.pagehead{text-align:center;padding:70px 24px 40px}
.pagehead h1{font-size:54px;line-height:1.1}
.pagehead p{color:var(--mute);max-width:640px;margin:14px auto 0}
/* home */
.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:56px;align-items:center;max-width:1240px;margin:auto;padding:64px 24px 40px}
.hero h1{font-size:72px;line-height:1}
.hero .sub{font-size:24px;font-style:italic;color:var(--mute);margin:16px 0 30px}
html[lang=ar] .hero .sub{font-style:normal}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;border:1px solid var(--ink);padding:13px 24px}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn:hover{opacity:.8}
.hero figure{margin:0;background:var(--paper);padding:22px;border:1px solid var(--line)}
.hero figcaption{margin-top:10px;color:var(--mute);font-size:16px;min-height:26px;transition:opacity .6s}
.stage{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--paper)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.6s ease;transform:scale(1)}
.stage img.on{opacity:1;animation:kb 7s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.dots{display:flex;gap:8px;justify-content:center;margin-top:8px}.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}.dots button.on{background:var(--ink)}
@media (prefers-reduced-motion:reduce){.stage img.on{animation:none}}
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:40px 0 0}
.strip .wrap{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.strip div>div{padding:30px 18px}
.strip div>div+div{border-inline-start:1px solid var(--line)}
.strip h4{font-weight:500;font-size:22px;margin:0 0 4px}
.strip p{margin:0;color:var(--mute);font-size:17px}
.sect{padding:70px 0 20px}
.secthead{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px;gap:20px}
.secthead h2{font-size:40px}
/* collection tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.tile{display:block;cursor:pointer}
.tile .im{aspect-ratio:4/5;background:var(--paper);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:18px}
.tile img{width:100%;height:100%;object-fit:contain;transition:transform .8s ease}
.tile:hover img{transform:scale(1.04)}
.tile h3{font-size:25px;margin-top:14px}
.tile p{margin:2px 0 0;color:var(--mute)}
/* works */
.works{display:grid;grid-template-columns:repeat(2,1fr);gap:56px 46px;padding-bottom:40px}
.work .im{background:var(--paper);border:1px solid var(--line);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:26px;cursor:zoom-in}
.work .im img{max-height:100%;object-fit:contain}
.work .im{position:relative}
.work .zm{position:absolute;bottom:14px;inset-inline-end:14px;width:46px;height:46px;border-radius:50%;background:rgba(250,247,241,.92);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(60,40,25,.18);pointer-events:none}
.work .zm svg{width:24px;height:24px;stroke:var(--ink,#3b2a20);fill:none;stroke-width:2}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.dgrid button{padding:0;border:1px solid var(--line);background:var(--paper);aspect-ratio:4/5;overflow:hidden;cursor:zoom-in}
.dgrid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.dgrid button:hover img{transform:scale(1.05)}
.work .cap{display:flex;justify-content:space-between;gap:20px;margin-top:16px}
.work h3{font-size:27px;line-height:1.2}
.work .alt{color:var(--mute);margin:2px 0 0}
.work .meta{color:var(--mute);font-size:16.5px;margin-top:8px}
.work .note{font-size:15.5px;color:var(--mute);font-style:italic;margin-top:4px}
.price{white-space:nowrap;color:var(--accent);font-weight:600;font-size:19px}
.sold{white-space:nowrap;color:var(--red);font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
.sold i{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block}
.back{display:inline-block;margin:30px 0 0;color:var(--mute)}
.collnav{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;margin-top:22px}
.collnav a{color:var(--mute)}.collnav a.on{color:var(--ink);border-bottom:1px solid var(--ink)}
/* about */
.about{display:grid;grid-template-columns:1fr 1.1fr;gap:64px;align-items:start;max-width:1140px;margin:auto;padding:30px 24px 60px}
.about figure{margin:0;background:var(--paper);border:1px solid var(--line);padding:20px;position:sticky;top:110px}
.about .txt p{font-size:21px;margin:0 0 18px}
.about .txt p:first-child::first-letter{font-size:64px;float:left;line-height:.9;padding:6px 10px 0 0}
html[lang=ar] .about .txt p:first-child::first-letter{font-size:inherit;float:none;padding:0}
.sig{margin-top:26px;display:flex;align-items:center;gap:14px}.sig img{height:70px}
.facts{border-top:1px solid var(--line);margin-top:26px;padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.facts span{display:block;color:var(--mute)}
/* new */
.newc{max-width:1140px;margin:auto;padding:10px 24px 70px;display:grid;grid-template-columns:1.1fr 1fr;gap:54px;align-items:center}
.veil{aspect-ratio:4/5;background:var(--paper);border:1px solid var(--line);position:relative;overflow:hidden}
.veil img{position:absolute;top:22%;left:50%;width:34%;transform:translateX(-50%);opacity:.18}
.veil span{position:absolute;inset:auto 0 22% 0;text-align:center;font-size:34px;font-style:italic;color:var(--ink)}
.date{font-size:46px;line-height:1.1;margin:6px 0 16px}
/* contact */
.contacts{max-width:1080px;margin:auto;padding:0 24px 80px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.card{background:var(--paper);border:1px solid var(--line);padding:40px 36px;text-align:center}
.card h3{font-size:30px;margin:8px 0 6px}
.card p{color:var(--mute);margin:0 0 22px}
.card .line{font-size:21px;display:block;margin:6px 0}
.card .line:hover{color:var(--accent)}
footer{border-top:1px solid var(--line);padding:34px 24px 46px;text-align:center;color:var(--mute);font-size:16px}
footer img{height:54px;margin:0 auto 8px;opacity:.9}
footer nav{display:flex;justify-content:center;gap:22px;margin-bottom:12px}
#lb{position:fixed;inset:0;background:#17120f;display:none;z-index:50;overflow-y:auto;overscroll-behavior:contain;color:#efe7dc}
#lb.on{display:block}
#lb .lbin{max-width:1100px;margin:0 auto;padding:64px 20px 56px}
#lb .x{position:fixed;top:14px;inset-inline-end:16px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(239,231,220,.35);background:rgba(20,15,12,.6);color:#efe7dc;font-size:24px;line-height:1;cursor:pointer;z-index:2}
#lb .sl{position:relative;direction:ltr}
#lb .tr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#lb .tr::-webkit-scrollbar{display:none}
#lb .sd{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;height:74vh}
#lb .sd img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(239,231,220,.35);background:rgba(20,15,12,.55);color:#efe7dc;font-size:22px;cursor:pointer}
#lb .nv.p{left:6px}#lb .nv.n{right:6px}#lb .nv[disabled]{opacity:.25;cursor:default}
#lb .dots{display:flex;justify-content:center;gap:10px;margin-top:16px;direction:ltr}
#lb .dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(239,231,220,.3);cursor:pointer}
#lb .dots button.on{background:#d8b48a;transform:scale(1.25)}
#lb .lab{text-align:center;color:#b9a998;font-size:14px;letter-spacing:.12em;margin-top:10px;min-height:20px}
#lb .info{text-align:center;margin:18px auto 0}
#lb .info h3{font-size:30px;font-weight:400;margin:0;color:#f4ece1}html[lang=ar] #lb .info h3{font-size:44px;line-height:1.1}
#lb .info .alt{color:#b9a998;margin:2px 0 0}
#lb .info .meta{color:#b9a998;font-size:16px;margin:8px 0 0}
#lb .info .price{color:#d8b48a}
#zv{position:fixed;inset:0;z-index:60;background:#0e0b09;display:none}
#zv.on{display:block}
#zv .sc{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:12px;-webkit-overflow-scrolling:touch}
#zv img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
#zv.z .sc{display:block;padding:0}#zv.z img{max-width:none;max-height:none;cursor:zoom-out}
#zv .x{position:fixed;top:14px;inset-inline-end:16px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(239,231,220,.35);background:rgba(20,15,12,.6);color:#efe7dc;font-size:24px;line-height:1;cursor:pointer;z-index:2}
#zv.z .hint{display:none}#zv .hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:rgba(239,231,220,.7);font-size:14px;pointer-events:none}
@media(max-width:700px){#lb .lbin{padding:70px 0 40px}#lb .sd{height:auto;padding:0 10px}#lb .sd img{max-height:64vh}#lb .nv{display:none}#lb .info{padding:0 14px}}
@media(max-width:900px){
 .bar{grid-template-columns:auto 1fr auto;padding:10px 16px}
 .mark{justify-self:start}.mark img{height:40px}.mark b{font-size:17px}
 nav.main{display:none;position:absolute;top:100%;inset-inline:0;background:var(--bg);flex-direction:column;gap:0;border-bottom:1px solid var(--line)}
 nav.main.open{display:flex;align-items:stretch}nav.main a{padding:16px;border:0;border-top:1px solid var(--line)}
 .left{order:3}.burger{display:block}
 .hero,.about,.newc,.contacts{grid-template-columns:1fr;gap:30px}
 .hero{padding:36px 16px 20px}.hero h1{font-size:52px}
 .strip .wrap{grid-template-columns:1fr}.strip div>div+div{border-inline-start:0;border-top:1px solid var(--line)}
 .tiles{grid-template-columns:1fr 1fr;gap:18px}.tile h3{font-size:20px}
 .works{grid-template-columns:1fr;gap:44px}
 .pagehead{padding:46px 16px 26px}.pagehead h1{font-size:40px}
 .wrap{padding:0 16px}.about figure{position:static}
 .secthead h2{font-size:30px}
}
@media(max-width:520px){.tiles{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}

.cover{position:relative;height:calc(100vh - 75px);min-height:520px;overflow:hidden}
.cover>img{width:100%;height:100%;object-fit:cover;animation:kb2 22s ease-in-out infinite alternate}
@keyframes kb2{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.veilc{position:absolute;inset:0;background:linear-gradient(90deg,rgba(25,18,14,.72),rgba(25,18,14,.25) 55%,rgba(25,18,14,0))}
html[dir=rtl] .veilc{background:linear-gradient(270deg,rgba(25,18,14,.72),rgba(25,18,14,.25) 55%,rgba(25,18,14,0))}
.ctext{position:absolute;inset-inline-start:max(24px,calc((100vw - 1240px)/2 + 24px));bottom:14%;color:#fbf8f3;max-width:560px}
.ctext .kicker{color:#e9dfd2}.ctext h1{font-size:86px;line-height:1}.ctext .sub{color:#efe6da;font-size:26px;font-style:italic;margin:14px 0 28px}
html[lang=ar] .ctext .sub{font-style:normal}
.btn.light{background:#fbf8f3;color:var(--ink);border-color:#fbf8f3}.btn.ghost{color:#fbf8f3;border-color:#fbf8f3}
.h2b{font-size:46px;line-height:1.1}.lead2{color:var(--mute);margin:14px 0 26px;font-size:20px}
.quote{background:var(--ink);color:#f3ece2;text-align:center;padding:70px 24px;margin:20px 0 0}
.quote .ui{color:#b9ab9c}.quote blockquote{font-size:44px;line-height:1.2;margin:10px auto 18px;max-width:900px;font-style:italic}
html[lang=ar] .quote blockquote{font-style:normal}
.quote p{max-width:760px;margin:0 auto;color:#d9cfc3;font-size:20px}
.story{padding:30px 24px}.srow{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;padding:56px 0;border-bottom:1px solid var(--line)}
.srow:nth-child(even) .stx{order:2}
.srow h2{font-size:38px;margin-bottom:12px}.stx p{font-size:20px}
.spics figure{margin:0;background:var(--paper);border:1px solid var(--line);padding:14px}.spics img{width:100%;max-height:560px;object-fit:cover}
.spics.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.spics figcaption{color:var(--mute);font-size:15px;margin-top:8px}
.tl{list-style:none;padding:0;margin:10px 0 0}.tl li{display:grid;grid-template-columns:112px 1fr;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:18px}
.tl b{font-family:Jost,sans-serif;font-weight:500;font-size:14px;letter-spacing:.06em;color:var(--accent);padding-top:4px}
.bts{padding:50px 24px 70px}.btsgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}.btsgrid img{width:100%;aspect-ratio:4/5;object-fit:cover}
@media(max-width:900px){.ctext h1{font-size:56px}.ctext{bottom:10%;inset-inline:16px}.cover{height:78vh}
 .srow{grid-template-columns:1fr;gap:26px;padding:36px 0}.srow:nth-child(even) .stx{order:0}.quote blockquote{font-size:30px}.btsgrid{grid-template-columns:1fr}.tl li{grid-template-columns:90px 1fr}}
.clist{background:var(--paper);border-top:1px solid var(--line);padding:64px 24px;text-align:center}
.clin{max-width:680px;margin:auto}.clin img{height:64px;margin:0 auto 10px}.clist h2{font-size:42px;margin-bottom:10px}.clist p{color:var(--mute)}
.clist .btns{justify-content:center;margin:22px 0 10px}.clist .small{font-size:15px}
html[lang=ar] .clist h2{font-size:60px}
</style>
</head>

 <div class="left"><nav class="main ui" id="nav">

 </nav></div>
 <a class="mark" href="#/"><img src="/logo.png" alt="Heba Eissa"><b data-t="name"></b></a>

</div></header>
<main>
<section class="page" id="p-home">
 <div class="cover"><img src="/img/studio-top.webp" alt="Heba Eissa in her studio"><div class="veilc"></div>
  <div class="ctext"><p class="kicker ui" data-t="fineart"></p><h1 data-t="name"></h1><p class="sub" data-t="tag"></p>
   <div class="btns"><a class="btn light ui" href="#/collections" data-t="viewcoll"></a><a class="btn ghost ui" href="#/about" data-t="meet"></a></div></div></div>
 <div class="hero">
  <div><p class="kicker ui" data-t="selected"></p><h2 class="h2b" data-t="selh"></h2><p class="lead2" data-t="selp"></p>
   <div class="btns"><a class="btn solid ui" href="#/collections" data-t="viewcoll"></a><a class="btn ui" href="#/new" data-t="new"></a></div></div>
