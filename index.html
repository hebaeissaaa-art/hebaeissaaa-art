<style>
:root{--bg:#f6f2eb;--paper:#fbf8f3;--ink:#231d19;--mute:#857a70;--line:#ddd4c8;--accent:#8a5a3c;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",serif;font-size:19px;line-height:1.65}
html[lang=ar] body{font-family:Amiri,serif;font-size:19px}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.ui{font-family:Jost,sans-serif;font-weight:400;letter-spacing:.16em;text-transform:uppercase;font-size:12.5px}
html[lang=ar] .ui{font-family:Amiri,serif;letter-spacing:0;text-transform:none;font-size:17px}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(246,242,235,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 24px}
.mark{display:flex;align-items:center;gap:12px;justify-self:center}
.mark img{height:50px}
.mark b{font-weight:500;font-size:21px;letter-spacing:.08em}
html[lang=ar] .mark b{letter-spacing:0}
nav.main{display:flex;gap:26px}
nav.main a{color:var(--mute);padding:4px 0;border-bottom:1px solid transparent}
nav.main a.on,nav.main a:hover{color:var(--ink);border-color:var(--ink)}
.right{justify-self:end;display:flex;align-items:center;gap:18px}
.lang{border:1px solid var(--ink);background:none;color:var(--ink);padding:6px 12px;cursor:pointer}
.burger{display:none;background:none;border:0;font-size:24px;cursor:pointer;color:var(--ink)}
/* pages */
main{min-height:70vh}
.page{display:none;animation:fade .5s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.wrap{max-width:1240px;margin:auto;padding:0 24px}
.kicker{color:var(--mute);margin:0 0 10px}
h1,h2,h3{font-weight:400;margin:0}
.pagehead{text-align:center;padding:70px 24px 40px}
.pagehead h1{font-size:54px;line-height:1.1}
.pagehead p{color:var(--mute);max-width:640px;margin:14px auto 0}
/* home */
.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:56px;align-items:center;max-width:1240px;margin:auto;padding:64px 24px 40px}
.hero h1{font-size:72px;line-height:1}
.hero .sub{font-size:24px;font-style:italic;color:var(--mute);margin:16px 0 30px}
html[lang=ar] .hero .sub{font-style:normal}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;border:1px solid var(--ink);padding:13px 24px}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn:hover{opacity:.8}
.hero figure{margin:0;background:var(--paper);padding:22px;border:1px solid var(--line)}
.hero figcaption{margin-top:10px;color:var(--mute);font-size:16px}
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:40px 0 0}
.strip .wrap{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.strip div>div{padding:30px 18px}
.strip div>div+div{border-inline-start:1px solid var(--line)}
.strip h4{font-weight:500;font-size:22px;margin:0 0 4px}
.strip p{margin:0;color:var(--mute);font-size:17px}
.sect{padding:70px 0 20px}
.secthead{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px;gap:20px}
.secthead h2{font-size:40px}
/* collection tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.tile{display:block;cursor:pointer}
.tile .im{aspect-ratio:4/5;background:var(--paper);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:18px}
.tile img{width:100%;height:100%;object-fit:contain;transition:transform .8s ease}
.tile:hover img{transform:scale(1.04)}
.tile h3{font-size:25px;margin-top:14px}
.tile p{margin:2px 0 0;color:var(--mute)}
/* works */
.works{display:grid;grid-template-columns:repeat(2,1fr);gap:56px 46px;padding-bottom:40px}
.work .im{background:var(--paper);border:1px solid var(--line);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:26px;cursor:zoom-in}
.work .im img{max-height:100%;object-fit:contain}
.work .cap{display:flex;justify-content:space-between;gap:20px;margin-top:16px}
.work h3{font-size:27px;line-height:1.2}
.work .alt{color:var(--mute);margin:2px 0 0}
.work .meta{color:var(--mute);font-size:16.5px;margin-top:8px}
.work .note{font-size:15.5px;color:var(--mute);font-style:italic;margin-top:4px}
.price{white-space:nowrap;color:var(--accent);font-weight:600;font-size:19px}
.sold{white-space:nowrap;color:var(--red);font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
.sold i{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block}
.back{display:inline-block;margin:30px 0 0;color:var(--mute)}
.collnav{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;margin-top:22px}
.collnav a{color:var(--mute)}.collnav a.on{color:var(--ink);border-bottom:1px solid var(--ink)}
/* about */
.about{display:grid;grid-template-columns:1fr 1.1fr;gap:64px;align-items:start;max-width:1140px;margin:auto;padding:30px 24px 60px}
.about figure{margin:0;background:var(--paper);border:1px solid var(--line);padding:20px;position:sticky;top:110px}
.about .txt p{font-size:21px;margin:0 0 18px}
.about .txt p:first-child::first-letter{font-size:64px;float:left;line-height:.9;padding:6px 10px 0 0}
html[lang=ar] .about .txt p:first-child::first-letter{font-size:inherit;float:none;padding:0}
.sig{margin-top:26px;display:flex;align-items:center;gap:14px}.sig img{height:70px}
.facts{border-top:1px solid var(--line);margin-top:26px;padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.facts span{display:block;color:var(--mute)}
/* new */
.newc{max-width:1140px;margin:auto;padding:10px 24px 70px;display:grid;grid-template-columns:1.1fr 1fr;gap:54px;align-items:center}
.veil{aspect-ratio:4/5;background:var(--paper);border:1px solid var(--line);position:relative;overflow:hidden}
.veil img{position:absolute;top:22%;left:50%;width:34%;transform:translateX(-50%);opacity:.18}
.veil span{position:absolute;inset:auto 0 22% 0;text-align:center;font-size:34px;font-style:italic;color:var(--ink)}
.date{font-size:46px;line-height:1.1;margin:6px 0 16px}
/* contact */
.contacts{max-width:1080px;margin:auto;padding:0 24px 80px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.card{background:var(--paper);border:1px solid var(--line);padding:40px 36px;text-align:center}
.card h3{font-size:30px;margin:8px 0 6px}
.card p{color:var(--mute);margin:0 0 22px}
.card .line{font-size:21px;display:block;margin:6px 0}
.card .line:hover{color:var(--accent)}
footer{border-top:1px solid var(--line);padding:34px 24px 46px;text-align:center;color:var(--mute);font-size:16px}
footer img{height:54px;margin:0 auto 8px;opacity:.9}
footer nav{display:flex;justify-content:center;gap:22px;margin-bottom:12px}
#lb{position:fixed;inset:0;background:rgba(18,14,12,.94);display:none;z-index:50;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;flex-direction:column}
#lb.on{display:flex}#lb img{max-width:100%;max-height:88vh;object-fit:contain}#lb p{color:#ddd;margin:12px 0 0}
@media(max-width:900px){
 .bar{grid-template-columns:auto 1fr auto;padding:10px 16px}
 .mark{justify-self:start}.mark img{height:40px}.mark b{font-size:17px}
 nav.main{display:none;position:absolute;top:100%;inset-inline:0;background:var(--bg);flex-direction:column;gap:0;border-bottom:1px solid var(--line)}
 nav.main.open{display:flex}nav.main a{padding:16px;border:0;border-top:1px solid var(--line)}
 .left{order:3}.burger{display:block}
 .hero,.about,.newc,.contacts{grid-template-columns:1fr;gap:30px}
 .hero{padding:36px 16px 20px}.hero h1{font-size:52px}
 .strip .wrap{grid-template-columns:1fr}.strip div>div+div{border-inline-start:0;border-top:1px solid var(--line)}
 .tiles{grid-template-columns:1fr 1fr;gap:18px}.tile h3{font-size:20px}
 .works{grid-template-columns:1fr;gap:44px}
 .pagehead{padding:46px 16px 26px}.pagehead h1{font-size:40px}
 .wrap{padding:0 16px}.about figure{position:static}
 .secthead h2{font-size:30px}
}
@media(max-width:520px){.tiles{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}
</style>
</head>

let L='en';try{L=localStorage.getItem('lang')||(navigator.language||'').startsWith('ar')&&'ar'||'en'}catch(e){}
const $=s=>document.querySelector(s);
function tile(c){return `<a class="tile" href="#/collections/${c.id}"><div class="im"><img loading="lazy" src="/img/${c.cover}-s.webp" alt="${c.en}"></div><h3>${L=='ar'?c.ar:c.en}</h3><p class="ui">${T[L].pieces(c.works.length)}</p></a>`}
function renderColl(id){const c=DATA.find(x=>x.id==id)||DATA[0];
 $('#ctitle').textContent=L=='ar'?c.ar:c.en;$('#calt').textContent=L=='ar'?c.en:c.ar;
 $('#collnav').innerHTML=DATA.map(x=>`<a class="${x.id==c.id?'on':''}" href="#/collections/${x.id}">${L=='ar'?x.ar:x.en}</a>`).join('');
 $('#works').innerHTML=c.works.map(w=>`<article class="work"><div class="im" data-full="/img/${w.img}.webp" data-cap="${(L=='ar'?w.ar:w.en)}"><img loading="lazy" src="/img/${w.img}-s.webp" width="${w.w}" height="${w.h}" alt="${w.en} — ${w.ar} · Heba Eissa"></div>
 <div class="cap"><div><h3>${L=='ar'?w.ar:w.en}</h3><p class="alt">${L=='ar'?w.en:w.ar}</p><p class="meta" dir="ltr" style="text-align:start">${[w.size,w.year].filter(Boolean).join(' · ')}</p>${w.note?`<p class="note" dir="ltr">${w.note}</p>`:''}</div>
 <div>${w.sold?`<span class="sold"><i></i>${T[L].acquired}</span>`:`<span class="price" dir="ltr">${w.price}</span>`}</div></div></article>`).join('');
 document.querySelectorAll('.work .im').forEach(el=>el.onclick=()=>{$('#lb img').src=el.dataset.full;$('#lb p').textContent=el.dataset.cap;$('#lb').classList.add('on')});}
function route(){const h=location.hash.replace(/^#\/?/,'');const [p,id]=h.split('/');const pg=p||'home';
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
 if(pg=='collections'&&id){$('#p-coll').classList.add('on');renderColl(id)}else{($('#p-'+pg)||$('#p-home')).classList.add('on')}
 document.querySelectorAll('nav.main a').forEach(a=>a.classList.toggle('on',a.dataset.r==pg));$('#nav').classList.remove('open');window.scrollTo(0,0)}
function apply(){document.documentElement.lang=L;document.documentElement.dir=L=='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(el=>{const v=T[L][el.dataset.t];if(typeof v=='string')el.textContent=v});
 $('#lang').textContent=T[L].langbtn;$('#hometiles').innerHTML=DATA.slice(0,3).map(tile).join('');$('#alltiles').innerHTML=DATA.map(tile).join('');
 document.title=L=='ar'?'هبة عيسى | فن تشكيلي':'Heba Eissa | Fine Art';route()}
$('#lang').onclick=()=>{L=L=='ar'?'en':'ar';try{localStorage.setItem('lang',L)}catch(e){}apply()};
$('#burger').onclick=()=>$('#nav').classList.toggle('open');
$('#lb').onclick=()=>$('#lb').classList.remove('on');document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#lb').classList.remove('on')});
window.addEventListener('hashchange',route);apply();
</script>
</body></html>
